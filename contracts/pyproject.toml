[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencam-contracts"
version = "0.1.0"
description = "Shared OpenCAM Pydantic request and response contracts"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.12.5",
    "typing-extensions>=4.14",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
