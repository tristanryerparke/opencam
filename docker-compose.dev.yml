# docker-compose.dev.yml
# Used for DEV environment deployment (not local development - use docker-compose.local.yml for that)
# Tailscale sidecar pattern for HTTPS via Tailscale Serve
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: web-app-template-tailscale-dev
    hostname: web-app-template-dev
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state-dev:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/web-app-template-frontend:latest
    container_name: web-app-template-frontend-dev
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/web-app-template-backend:latest
    container_name: web-app-template-backend-dev
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - frontend
    restart: unless-stopped
    volumes:
      - web-app-template-data-dev:/data

volumes:
  web-app-template-data-dev:
  tailscale-state-dev:
