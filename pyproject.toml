[build-system]
requires = ["setuptools>=68", "pybind11>=2.13", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "opencam"
version = "0.1.0"
description = "OpenCAM library and FastAPI server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gmsh>=4.15.0",
    "devtools>=0.12.2",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "manifold3d>=3.4.1",
    "mapbox-earcut>=2.0.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "numpydantic>=1.10.0",
    "pydantic>=2.12.5",
    "pydantic-to-typescript>=2",
    "pymeshlab>=2025.7.post1",
    "python-multipart>=0.0.27",
    "rhino-python-renderer",
    "rtree>=1.4.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tinydb>=4.8.2",
    "trimesh>=4.12.0",
    "uvicorn>=0.40.0",
]

[tool.uv.sources]
rhino-python-renderer = { path = "../rhino-python-renderer", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
